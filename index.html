<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOWSPACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home-screen" class="screen active">
        <header class="header">
            <h1 class="logo">FLOWSPACE</h1>
            <p class="subtitle">Personal Focus & Study Log</p>
        </header>

        <main class="dashboard-container">
            <section class="card stats-card">
                <h2>Overview</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="streak-days">0</span>
                        <span class="stat-label">Day Streak</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="yesterday-hours">0</span>
                        <span class="stat-label">Mins Today</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-sessions-count">0</span>
                        <span class="stat-label">Total Sessions</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="stat-total-minutes">0 mins</span>
                        <span class="stat-label">Time Logged</span>
                    </div>
                </div>
            </section>

            <section class="card focus-setup-card">
                <h2>Start a Session</h2>
                <div class="subject-picker">
                    <button class="subject-pill active" onclick="selectSubject('Physics')">Physics</button>
                    <button class="subject-pill" onclick="selectSubject('Chemistry')">Chemistry</button>
                    <button class="subject-pill" onclick="selectSubject('Maths')">Maths</button>
                    <button class="subject-pill" onclick="selectSubject('Skill Building')">Skills</button>
                </div>
                <input type="text" id="session-name" placeholder="What are you focusing on? (e.g. Calculus Practice)" autocomplete="off">
                <button class="btn primary-btn" onclick="startFocus()">Activate Flow</button>
            </section>

            <section class="card history-card">
                <h2>Activity & Log</h2>
                <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 12px;">View your past notes, bullet points, and study history.</p>
                <button class="btn secondary-btn" onclick="openModal('history-modal')">Open History & Calendar</button>
            </section>
        </main>
    </div>

    <div id="timer-screen" class="screen hidden">
        <div class="timer-container">
            <span id="current-subject" class="badge">Physics</span>
            <h2 id="current-topic">Deep Revision</h2>

            <div class="analog-clock">
                <div id="hour-hand" class="hand hour"></div>
                <div id="minute-hand" class="hand minute"></div>
                <div id="second-hand" class="hand second"></div>
                <div class="center-dot"></div>
            </div>

            <div id="time-display" class="digital-timer">00:00</div>

            <div class="timer-controls">
                <button id="pause-btn" class="btn secondary-btn" onclick="toggleTimer()">Pause</button>
                <button class="btn primary-btn" onclick="quitSession()">End Session</button>
            </div>

            <div class="scratchpad-box">
                <h3>Session Notes</h3>
                <input type="text" id="scratchpad" placeholder="Type a bullet note & press Enter..." onkeypress="handleBulletPoints(event)">
                <div id="active-bullet-list" class="bullet-list-display"></div>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('history-modal')">&times;</button>
            <h2>Study Calendar</h2>
            <div id="calendar-days" class="calendar-grid"></div>
            
            <hr style="margin: 16px 0; border: none; border-top: 1px solid rgba(0,0,0,0.1);">
            
            <h3>Logs & Bullet Points</h3>
            <div id="historical-notes-display" class="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
