<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Flow & JEE Syllabus Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container -->
  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon">F</div>
        <h1>Focus Flow</h1>
      </div>
      <button class="open-drawer-btn" onclick="toggleDrawer(true)">
        <span>📖 JEE Syllabus Tracker</span>
      </button>
    </header>

    <div class="dashboard-grid">
      <!-- Main Column: Timer & Tasks -->
      <div class="main-column">
        <!-- Pomodoro Timer -->
        <div class="card timer-card">
          <div class="timer-modes">
            <button class="mode-btn active" onclick="setTimerMode('focus', event)">Focus (25m)</button>
            <button class="mode-btn" onclick="setTimerMode('short', event)">Short Break (5m)</button>
            <button class="mode-btn" onclick="setTimerMode('long', event)">Long Break (15m)</button>
          </div>
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-controls">
            <button class="btn-main" id="startBtn" onclick="toggleTimer()">Start Flow</button>
            <button class="btn-secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>

        <!-- Today's Tasks -->
        <div class="card">
          <div class="card-title">
            <span>Today's Focus Tasks</span>
            <span style="font-size: 12px; color: var(--text-muted); font-weight: 500;" id="taskCount">0 tasks</span>
          </div>
          <div class="task-input-box">
            <input type="text" id="newTaskInput" placeholder="Add a target chapter or problem set..." onkeydown="if(event.key==='Enter') addTask()">
            <button onclick="addTask()">Add</button>
          </div>
          <ul class="task-list" id="taskList"></ul>
        </div>
      </div>

      <!-- Right Column: Subject Progress -->
      <div class="side-column">
        <div class="card">
          <div class="card-title">
            <span>Weighted Progress</span>
          </div>
          
          <div class="subject-summary-item physics-progress">
            <div class="summary-header">
              <span>Physics</span>
              <span class="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill fill-physics"></div>
            </div>
          </div>

          <div class="subject-summary-item chemistry-progress" style="margin-top: 18px;">
            <div class="summary-header">
              <span>Chemistry</span>
              <span class="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill fill-chemistry"></div>
            </div>
          </div>

          <div class="subject-summary-item math-progress" style="margin-top: 18px;">
            <div class="summary-header">
              <span>Mathematics</span>
              <span class="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill fill-math"></div>
            </div>
          </div>

          <button onclick="toggleDrawer(true)" style="width: 100%; margin-top: 20px; padding: 10px; background: var(--accent-soft); border: none; color: var(--accent-pink); border-radius: 12px; font-family: inherit; font-weight: 700; cursor: pointer; transition: background 0.2s;">
            Open Detailed Tracker →
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sliding Syllabus Drawer & Overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>

  <div class="syllabus-drawer" id="syllabusDrawer">
    <div class="drawer-header">
      <h2>JEE Syllabus Tracker</h2>
      <button class="close-drawer-btn" onclick="toggleDrawer(false)">✕</button>
    </div>

    <div class="drawer-tabs">
      <button class="tab-btn active" id="tab-physics" onclick="switchTab('physics')">Physics</button>
      <button class="tab-btn" id="tab-chemistry" onclick="switchTab('chemistry')">Chemistry</button>
      <button class="tab-btn" id="tab-math" onclick="switchTab('math')">Math</button>
    </div>

    <div class="drawer-content" id="drawerContent">
      <!-- Chapters injected by JavaScript -->
    </div>

    <div class="drawer-footer">
      Dhwani ♥ JEE Preparation Workflow
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
